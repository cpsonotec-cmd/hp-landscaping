<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="H&P">
<meta name="theme-color" content="#155e2e">
<title>H&P Landscaping — POS & Accounting</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --green:#1f7a3d; --green-d:#155e2e; --green-l:#e8f5ec; --lime:#7cb342;
  --ink:#1c2b22; --muted:#6b7d72; --line:#dfe6e0; --bg:#f4f7f4; --card:#fff;
  --red:#c0392b; --amber:#c9820a; --blue:#2b6cb0; --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:var(--green);text-decoration:none}
/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--green-d);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px;font-weight:700;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{width:30px;height:30px;background:var(--lime);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav{padding:10px 0;flex:1}
.nav a{display:flex;align-items:center;gap:11px;color:#d8ecdd;padding:11px 18px;font-size:14.5px;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--lime);font-weight:600}
.nav .ico{width:20px;text-align:center;font-size:16px}
.nav .sect{padding:14px 18px 5px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#8fc79f;font-weight:700}
.sync{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#bfe0c8}
.sync button{width:100%;margin-top:6px;background:var(--lime);color:#093;border:none;padding:7px;border-radius:7px;font-weight:600;font-size:12px;color:#0b3d1c}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;padding-top:max(14px,env(safe-area-inset-top))}
.topbar h1{margin:0;font-size:19px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
.content{padding:22px 24px;max-width:1200px;width:100%}
.sidebar{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* Mobile */
.hamburger{display:none;background:none;border:none;font-size:24px;color:var(--ink);padding:4px 6px}
.backdrop{display:none}
/* Tablet / iPad: hide fixed sidebar, use hamburger, roomier spacing */
@media(max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s;width:260px}
  .sidebar.open{transform:translateX(0)}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .hamburger{display:block}
}
@media(min-width:701px) and (max-width:1024px){
  /* iPad: larger touch targets & type */
  .content{padding:22px 28px}
  .nav a{padding:14px 20px;font-size:16px}
  .btn{padding:11px 18px;font-size:15px}
  .kpi .val{font-size:28px}
}
/* Phone */
@media(max-width:700px){
  .content{padding:14px}
  .topbar{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
  .topbar h1{font-size:17px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  /* bigger tap targets */
  .btn{padding:12px 16px;font-size:15px;min-height:44px}
  .btn.sm{padding:9px 13px;min-height:38px}
  .btn.ghost{padding:8px 10px;min-height:38px}
  .pill{padding:9px 15px;font-size:14px}
  .nav a{padding:15px 20px;font-size:16px}
  /* 16px inputs stop iOS auto-zoom */
  input,select,textarea{font-size:16px;padding:11px 12px}
  .modal-body{max-height:78vh}
  .modal-foot{position:sticky;bottom:0;background:#fff}
  .tabs button{padding:10px 12px}
}
/* touch devices: no hover flicker, comfy hit areas */
@media(hover:none){
  .tbl tr.click:active{background:#eef4ef}
}
/* Cards & grid */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.kpi{padding:16px 18px}
.kpi .label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin-top:5px}
.kpi .val.sm{font-size:20px}
.kpi .delta{font-size:12px;margin-top:3px;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)}
/* Section header */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;flex-wrap:wrap;gap:10px}
.sec-head h2{margin:0;font-size:17px}
/* Buttons */
.btn{background:var(--green);color:#fff;border:none;padding:9px 15px;border-radius:9px;font-weight:600;font-size:14px}
.btn:hover{background:var(--green-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:#f0f4f1}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{background:var(--red)}
.btn.ghost{background:transparent;color:var(--muted);border:none;padding:5px 8px}
.btn.ghost:hover{color:var(--ink)}
/* Tables */
table{width:100%;border-collapse:collapse}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tbl table{font-size:14px}
@media(max-width:700px){
  /* wide tables scroll sideways instead of squishing */
  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl table{min-width:480px}
}
.tbl th{text-align:left;padding:11px 14px;background:#f7faf8;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover{background:#f7faf8;cursor:pointer}
.right{text-align:right} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}
/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-green{background:var(--green-l);color:var(--green-d)}
.b-amber{background:#fdf0d5;color:var(--amber)}
.b-red{background:#fbe4e0;color:var(--red)}
.b-gray{background:#eef1ef;color:var(--muted)}
.b-blue{background:#e3eefb;color:var(--blue)}
/* Forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.row2,.row3{grid-template-columns:1fr}}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,40,28,.5);z-index:100;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
/* Line item editor */
.li{display:grid;grid-template-columns:2.2fr .7fr .9fr .9fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.li .h{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
@media(max-width:700px){
  /* stack each line item as a clean card on phones */
  .li{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fafcfa}
  .li .h{display:none}
  .li input,.li select{margin-bottom:7px}
  .li>div.right{text-align:left;font-weight:600;color:var(--green);padding:2px 0}
  .li>button{width:auto;min-height:38px;margin-top:2px}
}
.totbox{background:#f7faf8;border-radius:10px;padding:14px 16px;margin-top:12px}
.totrow{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.totrow.big{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
/* misc */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ico{font-size:40px;opacity:.4}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:260px}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}
.pill.active{background:var(--green);color:#fff;border-color:var(--green)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.mini{font-size:12.5px;color:var(--muted)}
.hint{background:var(--green-l);border:1px solid #cfe8d6;border-radius:10px;padding:10px 13px;font-size:13px;color:var(--green-d);margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tabs button.active{color:var(--green);border-bottom-color:var(--green)}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:700px){.split{grid-template-columns:1fr}}
/* receipt scanner */
.scan-drop{border:2px dashed var(--green);border-radius:12px;padding:26px 16px;text-align:center;background:var(--green-l);color:var(--green-d);cursor:pointer}
.scan-drop .ico{font-size:34px}
.rcpt-thumb{max-width:100%;max-height:230px;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto}
.scan-prog{height:8px;background:#e5ede7;border-radius:6px;overflow:hidden;margin:10px 0}
.scan-prog>span{display:block;height:100%;background:var(--green);width:0;transition:.2s}
.rcpt-mini{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;vertical-align:middle}
/* auth gate */
.auth-gate{display:none;position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,#155e2e,#1f7a3d 60%,#7cb342);align-items:center;justify-content:center;padding:20px;padding-top:max(20px,env(safe-area-inset-top))}
.auth-gate.show{display:flex}
.auth-card{background:#fff;border-radius:16px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.auth-brand{background:var(--green-d);color:#fff;padding:22px 24px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:9px}
.auth-brand .logo{width:32px;height:32px;background:var(--lime);border-radius:8px;display:flex;align-items:center;justify-content:center}
.auth-body{padding:24px}
.auth-body h3{margin:0 0 4px;font-size:19px}
.auth-body .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.auth-body .btn{width:100%;justify-content:center;padding:12px;min-height:46px;margin-top:4px}
.auth-alt{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted)}
.auth-alt a{cursor:pointer;font-weight:600}
.auth-err{background:#fbe4e0;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.auth-err.show{display:block}
.acct{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#bfe0c8}
.acct .who{color:#fff;font-weight:600;word-break:break-all;margin-bottom:6px}
.acct button{width:100%;background:transparent;border:1px solid rgba(255,255,255,.3);color:#e8f5ec;padding:7px;border-radius:7px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo">🌿</span> H&amp;P Landscaping</div>
    <div class="auth-body" id="authBody"></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">🌿</span> H&amp;P Landscaping</div>
    <nav class="nav" id="nav"></nav>
    <div class="sync">
      <div id="syncStatus">Saved locally</div>
      <button onclick="openSync()">☁ Backup / Sync</button>
    </div>
    <div class="acct" id="acctBox" style="display:none">
      <div class="who" id="acctWho"></div>
      <button onclick="cloudSignOut()">Sign out</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" onclick="toggleNav()"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamburger" onclick="toggleNav()">☰</button>
        <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub"></div></div>
      </div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ STORE ============ */
const DB_KEY='greenledger_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';

let DB=load();
function blank(){return{
  meta:{company:'H&P Landscaping',taxRate:8.0,nextQuote:1001,nextInvoice:5001,cloud:'',roles:{}},
  clients:[],items:[],quotes:[],invoices:[],jobs:[],schedules:[],expenses:[],
  accounts:defaultAccounts(),journals:[]
};}
function defaultAccounts(){return[
  {id:'1000',code:'1000',name:'Cash / Checking',type:'Asset'},
  {id:'1100',code:'1100',name:'Accounts Receivable',type:'Asset'},
  {id:'1200',code:'1200',name:'Inventory - Materials',type:'Asset'},
  {id:'1500',code:'1500',name:'Equipment',type:'Asset'},
  {id:'2000',code:'2000',name:'Accounts Payable',type:'Liability'},
  {id:'2200',code:'2200',name:'Sales Tax Payable',type:'Liability'},
  {id:'3000',code:'3000',name:'Owner Equity',type:'Equity'},
  {id:'4000',code:'4000',name:'Service Revenue',type:'Income'},
  {id:'4100',code:'4100',name:'Product Sales',type:'Income'},
  {id:'5000',code:'5000',name:'Materials & Supplies',type:'Expense'},
  {id:'5100',code:'5100',name:'Labor & Payroll',type:'Expense'},
  {id:'5200',code:'5200',name:'Fuel & Vehicle',type:'Expense'},
  {id:'5300',code:'5300',name:'Equipment Repair & Maint.',type:'Expense'},
  {id:'5400',code:'5400',name:'Subcontractors',type:'Expense'},
  {id:'5500',code:'5500',name:'Insurance',type:'Expense'},
  {id:'5600',code:'5600',name:'Rent & Utilities',type:'Expense'},
  {id:'5700',code:'5700',name:'Dump / Disposal Fees',type:'Expense'},
  {id:'5800',code:'5800',name:'Advertising & Marketing',type:'Expense'},
  {id:'5900',code:'5900',name:'Office & Admin',type:'Expense'},
];}
function load(){try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.meta)return d;}catch(e){}return blank();}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(DB));
  if(CLOUD.ready()){CLOUD.queuePush();}
  else{document.getElementById('syncStatus').textContent='Saved '+new Date().toLocaleTimeString();maybeCloudPush();}}

/* ============ CLOUD (Supabase) ============ */
const CLOUD={
  sb:null,session:null,_pt:null,_applying:false,
  cfg(){try{return JSON.parse(localStorage.getItem('gl_supabase'))||null;}catch(e){return null;}},
  setCfg(url,key){localStorage.setItem('gl_supabase',JSON.stringify({url:url.trim().replace(/\/$/,''),key:key.trim()}));},
  clearCfg(){localStorage.removeItem('gl_supabase');},
  configured(){const c=this.cfg();return !!(c&&c.url&&c.key&&typeof window.supabase!=='undefined');},
  ready(){return !!(this.sb&&this.session);},
  initClient(){const c=this.cfg();if(!c||typeof window.supabase==='undefined')return false;
    this.sb=window.supabase.createClient(c.url,c.key);return true;},
  async getSession(){if(!this.sb)return null;const{data}=await this.sb.auth.getSession();this.session=data.session;return this.session;},
  async signIn(email,pw){const{data,error}=await this.sb.auth.signInWithPassword({email,password:pw});
    if(error)throw error;this.session=data.session;return data;},
  async signUp(email,pw){const{data,error}=await this.sb.auth.signUp({email,password:pw});
    if(error)throw error;return data;},
  async signOut(){if(this.sb)await this.sb.auth.signOut();this.session=null;},
  async load(){ // pull shared workspace row (id=1); migrate local data if empty
    const{data,error}=await this.sb.from('workspace').select('data').eq('id',1).maybeSingle();
    if(error)throw error;
    if(data&&data.data&&data.data.meta){DB=data.data;localStorage.setItem(DB_KEY,JSON.stringify(DB));}
    else{await this.push(true);} // first run: seed cloud with current/local data
  },
  async push(force){if(!this.ready())return;
    const{error}=await this.sb.from('workspace').upsert({id:1,data:DB,updated_at:new Date().toISOString()});
    const s=document.getElementById('syncStatus');
    if(error){if(s)s.textContent='⚠ Cloud save failed';}
    else if(s)s.textContent='☁ Synced '+new Date().toLocaleTimeString();},
  queuePush(){clearTimeout(this._pt);const s=document.getElementById('syncStatus');if(s)s.textContent='Saving…';
    this._pt=setTimeout(()=>this.push(),1200);},
  subscribe(){if(!this.sb)return;
    this.sb.channel('ws').on('postgres_changes',{event:'*',schema:'public',table:'workspace'},payload=>{
      const nd=payload.new&&payload.new.data;if(!nd||!nd.meta)return;
      if(JSON.stringify(nd)===JSON.stringify(DB))return; // ignore our own echo
      if(document.getElementById('modalBg').classList.contains('show'))return; // don't disrupt active editing
      DB=nd;localStorage.setItem(DB_KEY,JSON.stringify(DB));
      const s=document.getElementById('syncStatus');if(s)s.textContent='↻ Updated by teammate';
      go(route);
    }).subscribe();
  }
};

/* ---- Auth gate UI ---- */
function showAuthGate(){document.getElementById('authGate').classList.add('show');renderAuth('login');}
function hideAuthGate(){document.getElementById('authGate').classList.remove('show');}
let _authMode='login';
function renderAuth(mode){_authMode=mode;const b=document.getElementById('authBody');
  if(mode==='config'){
    const c=CLOUD.cfg()||{};
    b.innerHTML=`<h3>Connect your cloud</h3><div class="sub">Paste the two keys from your Supabase project. One-time setup — see the guide.</div>
      <div class="auth-err" id="authErr"></div>
      <div class="field"><label>Project URL</label><input id="cf_url" value="${c.url||''}" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Anon public key</label><input id="cf_key" value="${c.key||''}" placeholder="eyJhbGci…"></div>
      <button class="btn" onclick="saveCloudCfg()">Connect</button>
      <div class="auth-alt">Already connected? <a onclick="renderAuth('login')">Back to login</a></div>`;
    return;
  }
  const signup=mode==='signup';
  b.innerHTML=`<h3>${signup?'Create staff login':'Sign in'}</h3>
    <div class="sub">${signup?'New team member? Make your login below.':'Welcome back. Enter your work login.'}</div>
    <div class="auth-err" id="authErr"></div>
    <div class="field"><label>Email</label><input id="au_email" type="email" autocomplete="username" placeholder="you@company.com"></div>

   converted:['b-green','Converted'],unpaid:['b-amber','Unpaid'],partial:['b-blue','Partial'],paid:['b-green','Paid'],

/* ============ CALC ============ */
function docTotals(d){
  const sub=(d.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0);
  const disc=Number(d.discount)||0;
  const taxable=(d.lines||[]).reduce((s,l)=>{const lt=(Number(l.qty)||0)*(Number(l.price)||0);return s+(l.taxable!==false?lt:0);},0);
  const afterDisc=sub-disc;
  const taxBase=sub>0?taxable*(afterDisc/sub):0;
  const tax=taxBase*((Number(d.taxRate)||0)/100);
  return{sub,disc,tax,total:afterDisc+tax};
}
const invPaid=inv=>(inv.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
const invBalance=inv=>docTotals(inv).total-invPaid(inv);
function invStatus(inv){const bal=invBalance(inv);const p=invPaid(inv);
  if(bal<=0.005)return'paid';if(p>0)return'partial';
  if(inv.dueDate&&inv.dueDate<today())return'overdue';return'unpaid';}

    </div><div id="cat"></div>`;

function renderCatalog(){

    list.map(i=>{const m=i.price>0?((i.price-(i.cost||0))/i.price*100):0;
    const low=i.trackInventory&&Number(i.qty)<=Number(i.reorder||0);
    return `<tr class="click" onclick="editItem('${i.id}')"><td><b>${i.name}</b>${i.unit?`<span class="mini"> /${i.unit}</span>`:''}</td>
      <td>${i.type==='service'?'<span class="badge b-blue">Service</span>':'<span class="badge b-gray">Material</span>'}</td>

    <div class="field"><label>Price (charge)</label><input id="i_price" type="number" step="0.01" value="${it.price||''}"></div>
    <div class="field"><label>Cost (your cost)</label><input id="i_cost" type="number" step="0.01" value="${it.cost||''}"></div></div>

    <div class="row2" id="invRow" style="display:${it.trackInventory?'grid':'none'}"><div class="field"><label>Qty on hand</label><input id="i_qty" type="number" step="0.01" value="${it.qty||0}"></div>

function saveItem(id){
  const o={name:V('i_name'),type:V('i_type'),unit:V('i_unit'),price:Number(V('i_price'))||0,cost:Number(V('i_cost'))||0,
    taxable:$('i_tax').checked,trackInventory:$('i_track').checked,qty:Number(V('i_qty'))||0,reorder:Number(V('i_reorder'))||0};

/* ============ LINE ITEM EDITOR (shared) ============ */
let LINES=[];
function lineEditorHTML(){
  return `<div class="li"><div class="h">Item / description</div><div class="h">Qty</div><div class="h">Price</div><div class="h right">Amount</div><div></div></div>
    <div id="lines"></div>
    <button class="btn sec sm" onclick="addLine()">+ Add line</button>
    <button class="btn sec sm" onclick="pickFromCatalog()">📦 From catalog</button>`;
}
function renderLines(){
  $('lines').innerHTML=LINES.map((l,idx)=>`<div class="li">
    <input value="${(l.desc||'').replace(/"/g,'&quot;')}" placeholder="Description" oninput="LINES[${idx}].desc=this.value;lineTotals()">
    <input type="number" step="0.01" value="${l.qty}" oninput="LINES[${idx}].qty=this.value;renderLines();lineTotals()">
    <input type="number" step="0.01" value="${l.price}" oninput="LINES[${idx}].price=this.value;renderLines();lineTotals()">
    <div class="right num" style="align-self:center">${money((Number(l.qty)||0)*(Number(l.price)||0))}</div>
    <button class="btn ghost" onclick="LINES.splice(${idx},1);renderLines();lineTotals()">✕</button>
  </div>`).join('');
  lineTotals();
}
function addLine(item){LINES.push(item||{desc:'',qty:1,price:0,taxable:true});renderLines();}
function pickFromCatalog(){
  if(!DB.items.length){toast('Add items in Catalog first');return;}
  const body=`<div class="tbl"><table><tbody>${DB.items.map(i=>`<tr class="click" onclick="addLine({desc:'${(i.name+(i.unit?' /'+i.unit:'')).replace(/'/g,'')}',qty:1,price:${i.price},taxable:${i.taxable!==false},itemId:'${i.id}'});closeModal2()"><td><b>${i.name}</b></td><td>${i.type}</td><td class="right num">${money(i.price)}</td></tr>`).join('')}</tbody></table></div>`;
  modal2('Pick from catalog',body);
}
/* secondary modal reuse main by stacking: simple approach re-open after */
function modal2(t,b){$('modal').setAttribute('data-prev',$('modal').innerHTML);modal(t,b,`<button class="btn sec" onclick="closeModal2()">Cancel</button>`);}
function closeModal2(){const p=$('modal').getAttribute('data-prev');if(p){$('modal').removeAttribute('data-prev');/* re-render current editor */if(currentEditor)currentEditor();}else closeModal();}
let currentEditor=null;
function lineTotals(){const box=$('lineTot');if(!box)return;
  const d={lines:LINES,discount:Number(V('d_disc'))||0,taxRate:Number(V('d_tax'))||0};
  const t=docTotals(d);
  box.innerHTML=`<div class="totrow"><span>Subtotal</span><span class="num">${money(t.sub)}</span></div>
    <div class="totrow"><span>Discount</span><span class="num">-${money(t.disc)}</span></div>
    <div class="totrow"><span>Tax (${d.taxRate}%)</span><span class="num">${money(t.tax)}</span></div>
    <div class="totrow big"><span>Total</span><span class="num">${money(t.total)}</span></div>`;
}

function setClientSelect(elId,sel){const el=$(elId);if(!el)return;
  el.innerHTML=`<option value="">— select client —</option>`+DB.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.company||c.name}</option>`).join('');}
function collectDoc(){return{clientId:V('d_client'),date:V('d_date'),expiry:V('d_expiry'),status:V('d_status'),
  lines:LINES.filter(l=>l.desc||l.price),discount:Number(V('d_disc'))||0,taxRate:Number(V('d_tax'))||0,notes:V('d_notes')};}
function saveQuote(id){
  const o=collectDoc();if(!o.clientId){toast('Select a client');return;}
  if(id)Object.assign(DB.quotes.find(q=>q.id===id),o);
  else{o.id=uid();o.num='Q-'+(DB.meta.nextQuote++);DB.quotes.push(o);}

}
function delQuote(id){if(!confirm('Delete quote?'))return;DB.quotes=DB.quotes.filter(q=>q.id!==id);save();closeModal();go('quotes');}
function viewQuote(id){
  const q=DB.quotes.find(x=>x.id===id);const t=docTotals(q);
  modal(`Quote ${q.num}`,docPreview(q,t),
    `<button class="btn danger" onclick="delQuote('${id}')">Delete</button><button class="btn sec" onclick="editQuote('${id}')">Edit</button>
     ${q.status!=='converted'?`<button class="btn" onclick="convertQuote('${id}')">→ Convert to Invoice</button>`:''}`,true);
}
function docPreview(d,t){return `<div style="border:1px solid var(--line);border-radius:10px;padding:18px">
  <div style="display:flex;justify-content:space-between"><div><b>${DB.meta.company}</b></div><div class="right">${badge(d.status)}</div></div>
  <div class="mini" style="margin:8px 0"><b>Bill to:</b> ${clientName(d.clientId)}<br>Date: ${fmtDate(d.date)}${d.expiry?` · Expires ${fmtDate(d.expiry)}`:''}${d.dueDate?` · Due ${fmtDate(d.dueDate)}`:''}</div>
  <div class="tbl" style="margin:10px 0"><table><thead><tr><th>Description</th><th class="right">Qty</th><th class="right">Price</th><th class="right">Amount</th></tr></thead><tbody>
  ${d.lines.map(l=>`<tr><td>${l.desc}</td><td class="right num">${l.qty}</td><td class="right num">${money(l.price)}</td><td class="right num">${money((Number(l.qty)||0)*(Number(l.price)||0))}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="totbox"><div class="totrow"><span>Subtotal</span><span class="num">${money(t.sub)}</span></div>
  ${t.disc?`<div class="totrow"><span>Discount</span><span class="num">-${money(t.disc)}</span></div>`:''}
  <div class="totrow"><span>Tax</span><span class="num">${money(t.tax)}</span></div>
  <div class="totrow big"><span>Total</span><span class="num">${money(t.total)}</span></div></div>
  ${d.notes?`<div class="mini" style="margin-top:10px"><b>Notes:</b> ${d.notes}</div>`:''}
  <div class="mini" style="margin-top:10px"><button class="btn sec sm" onclick="window.print()">🖨️ Print / Save PDF</button></div>
  </div>`;}
function convertQuote(id){
  const q=DB.quotes.find(x=>x.id===id);
  const inv={id:uid(),num:DB.meta.nextInvoice++,clientId:q.clientId,quoteId:id,date:today(),
    dueDate:new Date(Date.now()+15*864e5).toISOString().slice(0,10),
    lines:JSON.parse(JSON.stringify(q.lines)),discount:q.discount,taxRate:q.taxRate,notes:q.notes,payments:[],source:'quote'};
  DB.invoices.push(inv);q.status='converted';save();closeModal();toast('Invoice created');go('invoices');
}

/* ============ INVOICES ============ */
let invFilter='all';
function vInvoices(){
  setActions('<button class="btn" onclick="editInvoice()">+ New Invoice</button>');
  $('view').innerHTML=`<div class="toolbar">
    ${['all','unpaid','overdue','paid'].map(f=>`<span class="pill ${invFilter===f?'active':''}" onclick="invFilter='${f}';renderInvoices()">${f[0].toUpperCase()+f.slice(1)}</span>`).join('')}
  </div><div id="invtbl"></div>`;
  renderInvoices();
}
function renderInvoices(){
  let list=[...DB.invoices].reverse().filter(i=>{const s=invStatus(i);
    if(invFilter==='all')return true;if(invFilter==='unpaid')return s==='unpaid'||s==='partial'||s==='overdue';return s===invFilter;});
  $('invtbl').innerHTML=list.length?`<div class="tbl"><table><thead><tr><th>#</th><th>Client</th><th>Date</th><th>Due</th><th>Status</th><th class="right">Total</th><th class="right">Balance</th><th></th></tr></thead><tbody>${
    list.map(i=>`<tr class="click" onclick="viewInvoice('${i.id}')"><td>${i.num}</td><td>${clientName(i.clientId)}</td><td>${fmtDate(i.date)}</td><td>${fmtDate(i.dueDate)}</td><td>${badge(invStatus(i))}</td><td class="right num">${money(docTotals(i).total)}</td><td class="right num">${money(Math.max(0,invBalance(i)))}</td><td class="right"><button class="btn ghost" onclick="event.stopPropagation();recordPayment('${i.id}')">💵</button></td></tr>`).join('')
  }</tbody></table></div>`:`<div class="empty"><div class="ico">💵</div>No invoices in this view.</div>`;
}
function editInvoice(id){
  const inv=id?DB.invoices.find(x=>x.id===id):{clientId:'',date:today(),dueDate:new Date(Date.now()+15*864e5).toISOString().slice(0,10),taxRate:DB.meta.taxRate,discount:0,lines:[],notes:'',payments:[]};
  LINES=id?JSON.parse(JSON.stringify(inv.lines)):[{desc:'',qty:1,price:0,taxable:true}];
  currentEditor=()=>editInvoice(id);
  modal(id?`Invoice #${inv.num}`:'New Invoice',`
    <div class="row2"><div class="field"><label>Client</label><select id="d_client"></select></div>
    <div class="field"><label>Due date</label><input type="date" id="d_due" value="${inv.dueDate||''}"></div></div>
    <div class="field"><label>Invoice date</label><input type="date" id="d_date" value="${inv.date}"></div>
    <input type="hidden" id="d_status" value="unpaid">
    <label style="font-size:12.5px;font-weight:600;color:var(--muted)">Line items</label>
    ${lineEditorHTML()}
    <div class="row2" style="margin-top:12px"><div class="field"><label>Discount ($)</label><input type="number" step="0.01" id="d_disc" value="${inv.discount||0}" oninput="lineTotals()"></div>
    <div class="field"><label>Tax rate (%)</label><input type="number" step="0.01" id="d_tax" value="${inv.taxRate}" oninput="lineTotals()"></div></div>
    <div class="field"><label>Notes</label><textarea id="d_notes">${inv.notes||''}</textarea></div>
    <div class="totbox" id="lineTot"></div>`,
    `${id?`<button class="btn danger" onclick="delInvoice('${id}')">Delete</button>`:''}<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveInvoice('${id||''}')">Save Invoice</button>`,true);
  setClientSelect('d_client',inv.clientId);renderLines();
}
function saveInvoice(id){
  const o={clientId:V('d_client'),date:V('d_date'),dueDate:V('d_due'),lines:LINES.filter(l=>l.desc||l.price),
    discount:Number(V('d_disc'))||0,taxRate:Number(V('d_tax'))||0,notes:V('d_notes')};
  if(!o.clientId){toast('Select a client');return;}
  if(id)Object.assign(DB.invoices.find(i=>i.id===id),o);
  else{o.id=uid();o.num=DB.meta.nextInvoice++;o.payments=[];DB.invoices.push(o);deductInventory(o);}
  save();closeModal();toast('Invoice saved');go('invoices');
}
function deductInventory(doc){doc.lines.forEach(l=>{if(l.itemId){const it=DB.items.find(i=>i.id===l.itemId);if(it&&it.trackInventory){it.qty=(Number(it.qty)||0)-(Number(l.qty)||0);}}});}
function delInvoice(id){if(!confirm('Delete invoice?'))return;DB.invoices=DB.invoices.filter(i=>i.id!==id);save();closeModal();go('invoices');}
function viewInvoice(id){
  const inv=DB.invoices.find(x=>x.id===id);const t=docTotals(inv);const bal=invBalance(inv);
  const payHtml=(inv.payments||[]).length?`<h4 style="margin:14px 0 6px">Payments</h4><div class="tbl"><table><tbody>${inv.payments.map((p,i)=>`<tr><td>${fmtDate(p.date)}</td><td>${p.method}</td><td class="right num">${money(p.amount)}</td><td class="right"><button class="btn ghost" onclick="delPayment('${id}',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>`:'';
  modal(`Invoice #${inv.num}`,docPreview(inv,t)+payHtml+`<div class="totbox" style="margin-top:10px"><div class="totrow big"><span>Balance due</span><span class="num ${bal>0?'neg':'pos'}">${money(Math.max(0,bal))}</span></div></div>`,
    `<button class="btn sec" onclick="editInvoice('${id}')">Edit</button>${bal>0.005?`<button class="btn" onclick="recordPayment('${id}')">Record Payment</button>`:'<span class="badge b-green">Paid in full</span>'}`,true);
}
function recordPayment(id){
  const inv=DB.invoices.find(x=>x.id===id);const bal=Math.max(0,invBalance(inv));
  currentEditor=()=>viewInvoice(id);
  modal(`Payment — Invoice #${inv.num}`,`
    <div class="mini" style="margin-bottom:12px">Balance due: <b>${money(bal)}</b> — ${clientName(inv.clientId)}</div>
    <div class="row2"><div class="field"><label>Amount</label><input type="number" step="0.01" id="p_amt" value="${bal.toFixed(2)}"></div>
    <div class="field"><label>Date</label><input type="date" id="p_date" value="${today()}"></div></div>
    <div class="field"><label>Method</label><select id="p_method">${['Cash','Check','Card','ACH / Bank','Zelle / Venmo','Other'].map(m=>`<option>${m}</option>`).join('')}</select></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePayment('${id}')">Save Payment</button>`);
}
function savePayment(id){
  const inv=DB.invoices.find(x=>x.id===id);
  inv.payments=inv.payments||[];inv.payments.push({date:V('p_date'),amount:Number(V('p_amt'))||0,method:V('p_method')});
  save();closeModal();toast('Payment recorded');go('invoices');
}
function delPayment(id,i){const inv=DB.invoices.find(x=>x.id===id);inv.payments.splice(i,1);save();viewInvoice(id);}

/* ============ SCHEDULE ============ */
function addFreq(dateStr,freq){const d=new Date(dateStr+'T00:00');const map={weekly:7,biweekly:14,monthly:30};
  if(freq==='monthly'){d.setMonth(d.getMonth()+1);}else d.setDate(d.getDate()+(map[freq]||7));return d.toISOString().slice(0,10);}
function upcomingVisits(days){
  const out=[];const end=new Date(Date.now()+days*864e5).toISOString().slice(0,10);
  DB.schedules.filter(s=>s.active!==false).forEach(s=>{let d=s.nextDue||s.startDate;
    if(d&&d<=end)out.push({...s,date:d});});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function vSchedule(){
  setActions('<button class="btn" onclick="editSchedule()">+ New Recurring Service</button>');
  const list=DB.schedules;
  const soon=upcomingVisits(14);
  let html=`<div class="hint">Set up recurring maintenance (mowing, cleanups). Mark a visit "done" to roll it to the next date and it becomes billable.</div>`;
  html+=`<div class="split"><div>
    <div class="sec-head"><h2>Recurring services</h2></div>
    ${list.length?`<div class="tbl"><table><thead><tr><th>Client</th><th>Service</th><th>Freq</th><th>Next</th><th class="right">Price</th><th></th></tr></thead><tbody>${
      list.map(s=>`<tr><td>${clientName(s.clientId)}</td><td>${s.service}</td><td>${s.frequency}</td><td>${fmtDate(s.nextDue||s.startDate)}</td><td class="right num">${money(s.price)}</td><td class="right"><button class="btn ghost" onclick="editSchedule('${s.id}')">✎</button></td></tr>`).join('')
    }</tbody></table></div>`:`<div class="empty"><div class="ico">📅</div>No recurring services yet.</div>`}
  </div><div>
    <div class="sec-head"><h2>Next 14 days</h2></div>
    ${soon.length?soon.map(v=>`<div class="card pad" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><b>${fmtDate(v.date)}</b><div class="mini">${clientName(v.clientId)} · ${v.service}</div></div>
      <button class="btn sm" onclick="markDone('${v.id}')">✓ Done → Bill</button></div>`).join(''):'<div class="mini">Nothing scheduled.</div>'}
  </div></div>`;
  $('view').innerHTML=html;
}

/* ---- Receipt capture + OCR ---- */
function compressImage(file){return new Promise(res=>{
  const img=new Image();const rd=new FileReader();
  rd.onload=e=>{img.onload=()=>{const max=1100;let{width:w,height:h}=img;
    if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    res(cv.toDataURL('image/jpeg',0.6));};img.src=e.target.result;};
  rd.readAsDataURL(file);});}
function scanReceipt(){
  modal('Scan Receipt',`
    <div class="scan-drop" onclick="document.getElementById('scan_file').click()">
      <div class="ico">📷</div><div style="margin-top:6px"><b>Tap to take a photo</b> or choose an image</div>
      <div class="mini" style="margin-top:4px">We'll read the vendor, date and total automatically.</div>
    </div>
    <input type="file" id="scan_file" accept="image/*" capture="environment" style="display:none" onchange="handleScanFile(this)">
    <div id="scanArea" style="margin-top:14px"></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button>`);
}
async function handleScanFile(input){const f=input.files&&input.files[0];if(!f)return;
  const url=await compressImage(f);
  $('scanArea').innerHTML=`<img src="${url}" class="rcpt-thumb"><div class="scan-prog"><span id="scanBar"></span></div><div class="mini center" id="scanMsg">Reading receipt…</div>`;
  let text='';
  if(typeof Tesseract!=='undefined'){text=await runReceiptOCR(url,p=>{const b=$('scanBar');if(b)b.style.width=Math.round(p*100)+'%';});}
  else{$('scanMsg').textContent='';}
  const p=parseReceipt(text);
  const msg=$('scanMsg');if(msg)msg.textContent=text?'Done — opening expense…':'Could not read it — enter details manually.';
  setTimeout(()=>editExpense(null,{date:p.date||today(),amount:p.amount||'',vendor:p.vendor||'',category:p.category||'5000',method:'Card',notes:'Scanned receipt',receipt:url}),500);
}
function runReceiptOCR(url,onProg){return new Promise(res=>{
  let done=false;const finish=t=>{if(!done){done=true;res(t||'');}};
  const guard=setTimeout(()=>finish(''),30000);
  try{Tesseract.recognize(url,'eng',{logger:m=>{if(m.status==='recognizing text'&&onProg)onProg(m.progress);}})
    .then(r=>{clearTimeout(guard);finish(r&&r.data&&r.data.text);})
    .catch(()=>{clearTimeout(guard);finish('');});}
  catch(e){clearTimeout(guard);finish('');}
});}
function parseReceipt(text){
  const out={amount:'',date:'',vendor:'',category:''};
  if(!text)return out;
  const raw=text.split('\n').map(s=>s.trim()).filter(Boolean);
  // ---- amount ----
  const num=s=>parseFloat(s.replace(/[^0-9.]/g,''));
  const amtRe=/\d{1,5}[.,]\d{2}/g;
  let priority=[],all=[];
  raw.forEach(l=>{const low=l.toLowerCase();const ms=l.match(amtRe)||[];
    ms.forEach(m=>{const v=num(m.replace(',','.'));if(!isFinite(v))return;all.push(v);
      if(/(grand\s*total|amount\s*due|balance\s*due|total\s*due|^total|\btotal\b)/.test(low)&&!/sub[\s-]*total/.test(low))priority.push(v);});});
  const pick=arr=>arr.length?Math.max(...arr):null;
  const amt=pick(priority)||pick(all);
  if(amt)out.amount=amt.toFixed(2);
  // ---- date ----
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  let d=null;
  for(const l of raw){
    let m=l.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); // yyyy-mm-dd
    if(m){d=`${m[1]}-${p2(m[2])}-${p2(m[3])}`;break;}
    m=l.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); // mm/dd/yyyy
    if(m){let y=m[3];if(y.length===2)y='20'+y;d=`${y}-${p2(m[1])}-${p2(m[2])}`;break;}
    m=l.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/); // Jan 5, 2026
    if(m){const mo=months[m[1].slice(0,3).toLowerCase()];if(mo){d=`${m[3]}-${p2(mo)}-${p2(m[2])}`;break;}}
  }
  if(d&&d>='2015-01-01'&&d<='2100-01-01')out.date=d;
  // ---- vendor: first meaningful line ----
  for(const l of raw){const letters=(l.match(/[A-Za-z]/g)||[]).length;
    if(letters>=3&&!/receipt|invoice|order|www\.|http|tel|phone|\d{2}[\/\-.]\d{2}/i.test(l)){out.vendor=l.replace(/\s{2,}/g,' ').slice(0,40);break;}}
  // ---- category guess ----
  const t=text.toLowerCase();
  const map=[[/(shell|bp|exxon|chevron|mobil|marathon|fuel|gas station|gasoline|diesel)/,'5200'],
    [/(home depot|lowe'?s|siteone|nursery|garden|mulch|soil|fertilizer|plant|ace hardware|tractor supply|supply)/,'5000'],
    [/(insurance|state farm|geico|progressive|allstate)/,'5500'],
    [/(rental|rent|united rentals|sunbelt)/,'5300'],
    [/(dump|landfill|disposal|waste)/,'5700'],
    [/(office|staples|paper|ink)/,'5900']];
  for(const[re,acc]of map){if(re.test(t)){out.category=acc;break;}}
  return out;
}
function p2(n){return String(n).padStart(2,'0');}

/* ============ GENERAL LEDGER (derived double-entry) ============ */
function buildLedger(){
  const entries=[];
  // Invoices -> revenue recognized (accrual): Dr AR, Cr Income + Cr Tax Payable
  DB.invoices.forEach(inv=>{const t=docTotals(inv);
    const incAcct=inv.source==='pos'?'4100':'4000';
    entries.push({date:inv.date,ref:'INV-'+inv.num,memo:'Invoice '+clientName(inv.clientId),
      lines:[{acct:'1100',dr:t.total,cr:0},{acct:incAcct,dr:0,cr:t.total-t.tax},{acct:'2200',dr:0,cr:t.tax}]});
    (inv.payments||[]).forEach(p=>entries.push({date:p.date,ref:'PMT-'+inv.num,memo:'Payment '+p.method+' — '+clientName(inv.clientId),
      lines:[{acct:'1000',dr:p.amount,cr:0},{acct:'1100',dr:0,cr:p.amount}]}));
  });
  // Expenses -> Dr expense acct, Cr cash
  DB.expenses.forEach(e=>entries.push({date:e.date,ref:'EXP',memo:(e.vendor||'Expense')+(e.notes?' — '+e.notes:''),
    lines:[{acct:e.category,dr:Number(e.amount)||0,cr:0},{acct:'1000',dr:0,cr:Number(e.amount)||0}]}));
  // Manual journals
  DB.journals.forEach(j=>entries.push({date:j.date,ref:'JE',memo:j.memo,lines:j.lines.map(l=>({acct:l.acct,dr:Number(l.dr)||0,cr:Number(l.cr)||0}))}));
  return entries.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function vLedger(){
  const ent=buildLedger();
  let totDr=0,totCr=0;ent.forEach(e=>e.lines.forEach(l=>{totDr+=l.dr;totCr+=l.cr;}));
  let rows='';ent.forEach(e=>{e.lines.forEach((l,i)=>{rows+=`<tr><td>${i===0?fmtDate(e.date):''}</td><td>${i===0?e.ref:''}</td><td class="mini">${i===0?e.memo:''} <span style="padding-left:12px">${acctName(l.acct)}</span></td><td class="right num">${l.dr?money(l.dr):''}</td><td class="right num">${l.cr?money(l.cr):''}</td></tr>`;});});
  $('view').innerHTML=`<div class="hint">The ledger is generated automatically from invoices, payments and expenses (double-entry). Add manual journal entries for owner contributions, depreciation, etc.</div>
    <div class="sec-head"><h2>Transactions</h2><button class="btn sm" onclick="addJournal()">+ Journal Entry</button></div>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Ref</th><th>Account / memo</th><th class="right">Debit</th><th class="right">Credit</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=5 class="center mini" style="padding:30px">No transactions yet.</td></tr>'}</tbody>
    <tfoot><tr style="font-weight:700;background:#f7faf8"><td colspan=3 class="right">Totals</td><td class="right num">${money(totDr)}</td><td class="right num">${money(totCr)}</td></tr></tfoot></table></div>
    <div class="mini" style="margin-top:8px">${Math.abs(totDr-totCr)<0.01?'✅ Books balance (debits = credits).':'⚠️ Out of balance by '+money(Math.abs(totDr-totCr))}</div>`;
}
let JE=[];
function addJournal(){
  JE=[{acct:'1000',dr:0,cr:0},{acct:'3000',dr:0,cr:0}];
  modal('Manual Journal Entry',`
    <div class="row2"><div class="field"><label>Date</label><input type="date" id="je_date" value="${today()}"></div>
    <div class="field"><label>Memo</label><input id="je_memo" placeholder="e.g. Owner capital"></div></div>

function jeRender(){
  $('jePane').innerHTML=`<div class="li"><div class="h">Account</div><div class="h">Debit</div><div class="h">Credit</div><div></div><div></div></div>`+
    JE.map((l,i)=>`<div class="li"><select onchange="JE[${i}].acct=this.value">${DB.accounts.map(a=>`<option value="${a.id}" ${l.acct===a.id?'selected':''}>${a.code} ${a.name}</option>`).join('')}</select>
    <input type="number" step="0.01" value="${l.dr||''}" oninput="JE[${i}].dr=this.value;jeRender()">
    <input type="number" step="0.01" value="${l.cr||''}" oninput="JE[${i}].cr=this.value;jeRender()">
    <button class="btn ghost" onclick="JE.splice(${i},1);jeRender()">✕</button><div></div></div>`).join('');
  const dr=JE.reduce((s,l)=>s+(Number(l.dr)||0),0),cr=JE.reduce((s,l)=>s+(Number(l.cr)||0),0);
  $('jeTot').innerHTML=`<div class="totrow"><span>Debits</span><span class="num">${money(dr)}</span></div><div class="totrow"><span>Credits</span><span class="num">${money(cr)}</span></div><div class="totrow big"><span>${Math.abs(dr-cr)<0.01?'Balanced ✓':'Difference'}</span><span class="num ${Math.abs(dr-cr)<0.01?'pos':'neg'}">${money(Math.abs(dr-cr))}</span></div>`;
}
function saveJournal(){
  const dr=JE.reduce((s,l)=>s+(Number(l.dr)||0),0),cr=JE.reduce((s,l)=>s+(Number(l.cr)||0),0);
  if(Math.abs(dr-cr)>0.01){toast('Debits must equal credits');return;}
  DB.journals.push({id:uid(),date:V('je_date'),memo:V('je_memo')||'Journal entry',lines:JE.filter(l=>l.dr||l.cr)});
  save();closeModal();toast('Entry posted');go('ledger');
}

function vAccounts(){

function accountBalances(start,end){
  const bal={};const ent=buildLedger();
  ent.forEach(e=>{if(start&&e.date<start)return;if(end&&e.date>end)return;
    e.lines.forEach(l=>{const a=DB.accounts.find(x=>x.id===l.acct);if(!a)return;
      const sign=(a.type==='Asset'||a.type==='Expense')?1:-1;bal[l.acct]=(bal[l.acct]||0)+sign*(l.dr-l.cr);});});
  return bal;
}
function editAccount(id){
  const a=id?DB.accounts.find(x=>x.id===id):{type:'Expense'};
  modal(id?'Edit Account':'New Account',`
    <div class="row2"><div class="field"><label>Code</label><input id="a_code" value="${a.code||''}"></div>
    <div class="field"><label>Type</label><select id="a_type">${['Asset','Liability','Equity','Income','Expense'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="field"><label>Account name</label><input id="a_name" value="${a.name||''}"></div>`,
    `${id?`<button class="btn danger" onclick="delAccount('${id}')">Delete</button>`:''}<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAccount('${id||''}')">Save</button>`);
}
function saveAccount(id){
  const o={code:V('a_code'),name:V('a_name'),type:V('a_type')};if(!o.name){toast('Name required');return;}
  if(id)Object.assign(DB.accounts.find(a=>a.id===id),o);else{o.id=o.code||uid();DB.accounts.push(o);}
  save();closeModal();go('accounts');
}
function delAccount(id){if(!confirm('Delete account?'))return;DB.accounts=DB.accounts.filter(a=>a.id!==id);save();closeModal();go('accounts');}

let repTab='pl';
let REPORT_RANGE={preset:'this_year',start:'',end:''};
const PRESETS=[['this_month','This month'],['last_month','Last month'],['this_quarter','This quarter'],['last_quarter','Last quarter'],['this_year','This year'],['last_year','Last year'],['ytd','Year to date'],['all','All time'],['custom','Custom…']];
function computeRange(preset){
  const p2=n=>String(n).padStart(2,'0');
  const fmt=(y,m,d)=>`${y}-${p2(m+1)}-${p2(d)}`;
  const first=(y,m)=>fmt(y,m,1);
  const last=(y,m)=>fmt(y,m,new Date(y,m+1,0).getDate());
  const now=new Date();const y=now.getFullYear();const mo=now.getMonth();const q=Math.floor(mo/3);
  switch(preset){
    case'this_month':return{start:first(y,mo),end:last(y,mo)};
    case'last_month':{const yy=mo===0?y-1:y,mm=mo===0?11:mo-1;return{start:first(yy,mm),end:last(yy,mm)};}
    case'this_quarter':return{start:first(y,q*3),end:last(y,q*3+2)};
    case'last_quarter':{let lq=q-1,yy=y;if(lq<0){lq=3;yy--;}return{start:first(yy,lq*3),end:last(yy,lq*3+2)};}
    case'this_year':return{start:first(y,0),end:last(y,11)};
    case'last_year':return{start:first(y-1,0),end:last(y-1,11)};
    case'ytd':return{start:first(y,0),end:today()};
    case'all':return{start:'',end:''};
    default:return{start:REPORT_RANGE.start,end:REPORT_RANGE.end};
  }
}
function reportRange(){return REPORT_RANGE.preset==='custom'?{start:REPORT_RANGE.start,end:REPORT_RANGE.end}:computeRange(REPORT_RANGE.preset);}
function rangeLabel(){const r=reportRange();if(!r.start&&!r.end)return'All time';
  return (r.start?fmtDate(r.start):'start')+' – '+(r.end?fmtDate(r.end):'today');}
function onPreset(p){REPORT_RANGE.preset=p;if(p!=='custom'){const r=computeRange(p);REPORT_RANGE.start=r.start;REPORT_RANGE.end=r.end;}vReports();}
function setRangeField(which,val){REPORT_RANGE.preset='custom';REPORT_RANGE[which]=val;vReports();}
function vReports(){
  const r=reportRange();

      <div class="field" style="margin:0"><label>Period</label><select id="rp_preset" onchange="onPreset(this.value)">${PRESETS.map(p=>`<option value="${p[0]}" ${REPORT_RANGE.preset===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
      <div class="field" style="margin:0"><label>From</label><input type="date" value="${r.start||''}" onchange="setRangeField('start',this.value)"></div>
      <div class="field" style="margin:0"><label>To</label><input type="date" value="${r.end||''}" onchange="setRangeField('end',this.value)"></div>

    </tbody></table><div class="mini" style="margin-top:8px">${Math.abs(aTot-(lTot+eqTot))<1?'✅ Balanced':'Note: minor rounding differences may appear.'}</div></div>`;

function repAR(){

    <tr style="border-top:2px solid var(--ink);font-weight:700"><td>Sales tax collected (owed)</td><td class="right num">${money(collected)}</td></tr>
    </tbody></table>
    <div class="hint" style="margin-top:14px">This is tax you've billed customers and owe to your state for this period. Remit per your filing schedule.</div></div>`;
}

/* ============ SYNC / BACKUP ============ */
function openSync(){
  const connected=CLOUD.ready();
  modal('Account, Backup & Sync',`
    <h4>☁ Cloud login (Supabase)</h4>
    ${connected?`<div class="hint">Signed in as <b>${CLOUD.session.user.email}</b>. Your team shares this data live. <div style="margin-top:8px"><button class="btn sec sm" onclick="cloudSignOut()">Sign out</button></div></div>`
      :`<div class="mini" style="margin-bottom:8px">Turn this into a shared cloud app your staff log into from any device. One-time setup with a free Supabase account — follow the setup guide, then connect here.</div>
        <button class="btn" onclick="openCloudSetup()">Set up / connect cloud login</button>`}
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
    <h4>Local backup</h4>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn sec" onclick="exportData()">⬇ Download backup (.json)</button>
      <label class="btn sec" style="margin:0">⬆ Restore from file<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
    </div>
    <h4>Simple sync without login (jsonbin)</h4>
    <div class="mini" style="margin-bottom:8px">Alternative to the login above: a free bin at <b>jsonbin.io</b> syncs data across devices with no accounts. Use this <i>or</i> the cloud login, not both.</div>
    <div class="field"><label>JSONBin Bin URL</label><input id="sy_url" value="${(DB.meta.cloud&&DB.meta.cloud.url)||''}" placeholder="https://api.jsonbin.io/v3/b/xxxx"></div>
    <div class="field"><label>Master Key (X-Master-Key)</label><input id="sy_key" value="${(DB.meta.cloud&&DB.meta.cloud.key)||''}" placeholder="$2a$10$..."></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="saveCloud()">Save & Push now</button>
      <button class="btn sec" onclick="cloudPull()">⬇ Pull from cloud</button>
      ${DB.meta.cloud&&DB.meta.cloud.url?`<button class="btn sec" onclick="DB.meta.cloud='';save();toast('Disconnected');closeModal()">Disconnect</button>`:''}
    </div>
    <div class="mini" id="cloudMsg" style="margin-top:10px"></div>`,
    `<button class="btn" onclick="closeModal()">Done</button>`,true);
}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='greenledger-backup-'+today()+'.json';a.click();toast('Backup downloaded');}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(c=>{c=(c==null?'':String(c));return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast('CSV exported');}
function exportReportCSV(){
  const r=reportRange();const lbl=rangeLabel();
  if(repTab==='pl'){const bal=accountBalances(r.start,r.end);const rows=[['Profit & Loss',lbl],[],['Account','Type','Amount']];
    DB.accounts.filter(a=>a.type==='Income'||a.type==='Expense').forEach(a=>{if(bal[a.id])rows.push([a.name,a.type,Math.abs(bal[a.id]).toFixed(2)]);});
    const inc=DB.accounts.filter(a=>a.type==='Income').reduce((s,a)=>s+Math.abs(bal[a.id]||0),0);
    const exp=DB.accounts.filter(a=>a.type==='Expense').reduce((s,a)=>s+(bal[a.id]||0),0);
    rows.push([],['Total Income','',inc.toFixed(2)],['Total Expenses','',exp.toFixed(2)],['Net Profit','',(inc-exp).toFixed(2)]);
    downloadCSV('P&L_'+(r.start||'all')+'_'+(r.end||'')+'.csv',rows);}
  else if(repTab==='bs'){const asOf=r.end||today();const bal=accountBalances('',asOf);const rows=[['Balance Sheet','As of '+asOf],[],['Account','Type','Balance']];
    ['Asset','Liability','Equity'].forEach(t=>DB.accounts.filter(a=>a.type===t).forEach(a=>rows.push([a.name,t,(bal[a.id]||0).toFixed(2)])));
    downloadCSV('BalanceSheet_'+asOf+'.csv',rows);}
  else if(repTab==='ar'){const asOf=r.end||today();const rows=[['A/R Aging','As of '+asOf],[],['Invoice','Client','Due','Days late','Balance']];
    DB.invoices.forEach(i=>{if(i.date>asOf)return;const b=invBalance(i);if(b<=0.005)return;
      const days=Math.floor((new Date(asOf)-new Date(i.dueDate||i.date))/864e5);rows.push(['#'+i.num,clientName(i.clientId),i.dueDate||'',days>0?days:0,b.toFixed(2)]);});
    downloadCSV('AR_Aging_'+asOf+'.csv',rows);}
  else{const inR=i=>(!r.start||i.date>=r.start)&&(!r.end||i.date<=r.end);const rows=[['Sales Tax',lbl],[],['Invoice','Date','Client','Taxable','Tax']];
    DB.invoices.filter(inR).forEach(i=>{const t=docTotals(i);rows.push(['#'+i.num,i.date,clientName(i.clientId),(t.sub-t.disc).toFixed(2),t.tax.toFixed(2)]);});
    downloadCSV('SalesTax_'+(r.start||'all')+'.csv',rows);}
}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.meta)throw'bad';DB=d;save();closeModal();toast('Data restored');go('dashboard');}catch(x){toast('Invalid backup file');}};r.readAsText(f);}
function saveCloud(){DB.meta.cloud={url:V('sy_url'),key:V('sy_key')};save();cloudPush(true);}
function maybeCloudPush(){/* debounced push */ if(DB.meta.cloud&&DB.meta.cloud.url){clearTimeout(window._ct);window._ct=setTimeout(()=>cloudPush(false),1500);}}
async function cloudPush(notify){
  const c=DB.meta.cloud;if(!c||!c.url)return;
  try{const r=await fetch(c.url,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':c.key},body:JSON.stringify(DB)});
    if(!r.ok)throw r.status;document.getElementById('syncStatus').textContent='☁ Synced '+new Date().toLocaleTimeString();
    if(notify){toast('Pushed to cloud');const m=$('cloudMsg');if(m)m.textContent='✅ Synced.';}}
  catch(e){if(notify){toast('Cloud push failed');const m=$('cloudMsg');if(m)m.textContent='⚠️ Failed: check URL/key.';}}
}
async function cloudPull(){
  const c=DB.meta.cloud;if(!c||!c.url){toast('Enter cloud details first');return;}
  try{const r=await fetch(c.url+'/latest',{headers:{'X-Master-Key':c.key}});const j=await r.json();
    const d=j.record||j;if(d&&d.meta){DB=d;save();closeModal();toast('Pulled from cloud');go('dashboard');}}
  catch(e){toast('Pull failed');}
}

/* ============ INIT ============ */
function bootApp(){renderNav();const start=location.hash.slice(1);go(ROUTES[start]?start:'dashboard');}
function openCloudSetup(){closeModal();document.getElementById('authGate').classList.add('show');renderAuth('config');}
async function initApp(){
  if(CLOUD.configured()){
    CLOUD.initClient();
    let sess=null;try{sess=await CLOUD.getSession();}catch(e){}
    if(sess){
      try{await CLOUD.load();ensureRole(sess.user.email);CLOUD.subscribe();showAccount();bootApp();return;}
      catch(e){/* fall through to gate with error */}
    }
    // configured but not signed in (or load failed)
    seedData();bootApp();showAuthGate();
    return;
  }
  // local-only mode (no cloud configured yet)
  seedData();bootApp();
}
initApp();
